name: Bug report
description: Report a problem with bbweb Installer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bbweb Installer version
      placeholder: e.g. 0.1.0
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 10/11
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: If available, attach relevant lines from the log file or command output.
      placeholder: "C:\\Users\\<user>\\.bbweb\\logs\\bbwebinstaller.log"
